# Coolify app "supabase-deployer": Docker Compose build pack
#   Base Directory: /deploy/supabase    Compose Location: /docker-compose.yml
# Env (Coolify): POSTGRES_PASSWORD = the Supabase service's SERVICE_PASSWORD_POSTGRES
services:
  deployer:
    build:
      context: ../..
      dockerfile: deploy/supabase/Dockerfile
    restart: 'no'
    environment:
      PGHOST: supabase-db
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      APP_SCHEMA: ${APP_SCHEMA:-portfolio}
      FUNCTIONS_DIR: /functions
      SUDO: ''
    volumes:
      - /data/coolify/services/cpahgclbkgadccrsd81ioi7o/volumes/functions:/functions
    networks:
      - supabase

networks:
  supabase:
    external: true
    name: cpahgclbkgadccrsd81ioi7o
