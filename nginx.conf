server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_static on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  # PWA: never cache the service worker or manifest
  location ~ ^/(sw\.js|workbox-.*\.js|registerSW\.js|manifest\.webmanifest|index\.html)$ {
    add_header Cache-Control "no-cache";
  }
  location /api/ { return 404; }
  error_page 404 /404.html;
  location = /404.html { internal; }
  # Only the SPA's own routes get index.html; any other path is a real 404 (public/404.html sends the browser back to the app)
  # shortcut: /projects/<unknown-slug> still returns 200, the slug lives in the database
  location ~ ^/(news|projects/[^/]+|admin(/.*)?|s/[^/]+)/?$ { try_files /index.html =404; }
  location / { try_files $uri $uri/ =404; }
}
